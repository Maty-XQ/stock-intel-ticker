name: 定时触发 · 股票情报云端版

# 这个仓库是"公开空壳"，只干一件事：被触发时调用【私有仓库 stock-intel-cloud】的 workflow_dispatch。
#
# 现在的定位（2026-09-21 大改之后的现状）：
#   · **主路 = 外部定时器 cron-job.org**（准点、秒级 jitter，见 FALLBACK_cron-job.org.md）；
#   · **兜底 = 云端私有仓库自己的 GitHub schedule**（会触发但迟到几十分钟~几小时，
#     它能把触发表达式传给脚本，所以时点判定是确定性的，不会写错标记）；
#   · **本仓库的 schedule 已删除，只留手动触发** —— 触发方式见下。
#
# 本仓库 schedule 被删的三条实测理由（留档，别再把它加回来）：
#   1. 2026-09-21 它当天只触发 2/6 条（13:30→13:34:04、14:45→15:15:50），其余没触发，
#      却制造了 2 条"多余运行"（云端 #18 / #22），排查它花了不少时间；
#   2. **真正的隐患**：它 dispatch 时只传 mode、不传 slot，三条 alert 共用 mode=alert，
#      一旦在错误的时间迟到，云端只能按当前时间猜时点 —— 可能猜成 alert1315 并写掉它的标记，
#      当天午后异动就被静默跳过了。删掉 schedule 同时消除"多余运行"与"写错标记"两个风险；
#   3. 它的存在源于一个已被推翻的结论（"私有仓库不触发 schedule"）。实测：都会触发，
#      只是都不可靠（best-effort）。所以"公开仓库当定时器"这层拆解现在没有独特价值。
#
# 安全边界（这个仓库可以公开的前提）：
#   - 不含任何持仓、策略、脚本、Webhook 地址，只有一个 curl 调用；
#   - 触发用的令牌存在 Actions Secrets（加密存储，fork 不会继承，他人不可见）；
#   - 即使有人看到，也只能得到"存在一个每天定时推送的私有仓库"这个信息。

on:
  # 【2026-09-21 改动】这里原来的 6 条 schedule cron **已移除**，只保留手动触发。
  # 原因（有实测证据）：
  #   ① 它的作用是"兜底"，但 cron-job.org（主路）已实测准点，而本仓库的 schedule 昨天只触发 2/6 条、
  #      还迟到 4~30 分钟，每天制造 1~2 条"多余运行"；
  #   ② 更要紧的隐患：它 dispatch 时**只传 mode、不传 slot**（三条 alert 共用 mode=alert），
  #      一旦在某个错误的时间迟到触发，云端只能按当前时间猜时点 —— 可能猜成 alert1315 并写掉它的标记，
  #      导致当天午后异动被静默跳过。删掉 schedule 就同时消除"多余运行"和"写错标记"两个风险。
  #   ③ 真正的兜底还在：云端私有仓库自己的 schedule 会触发（同样迟到但**会把触发表达式传给脚本**，
  #      时点判定是确定性的，不会写错标记）。
  # 本文件保留 workflow_dispatch + curl 那一步：需要时仍可手动/由脚本触发一次（命令见 README）。
  workflow_dispatch:
    inputs:
      mode:
        description: "手动测试：跑哪一段"
        type: choice
        options: [premarket, alert, postclose, weekly]
        default: postclose

permissions:
  contents: read        # 本仓库只读，不写任何东西

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: 确认本次该跑哪一段
        id: pick
        run: |
          # schedule 已删除，现在只有手动触发 → 直接用 inputs.mode
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE=postclose; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次触发模式：$MODE（手动触发）"

      - name: 通知私有仓库开始取数推送
        run: |
          set -e
          MODE="${{ steps.pick.outputs.mode }}"
          CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.INTEL_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Maty-XQ/stock-intel-cloud/actions/workflows/intel.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"$MODE\"}}")
          echo "HTTP $CODE"
          cat /tmp/resp.txt 2>/dev/null || true
          echo
          if [ "$CODE" != "204" ]; then
            echo "❌ 触发失败（204 才算成功）：$CODE"
            exit 1
          fi
          echo "✅ 已通知私有仓库运行 mode=$MODE"
