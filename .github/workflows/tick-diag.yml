name: 诊断 · schedule 是否真的生效（验完即删）

# 临时文件：只为验证"公开仓库的 schedule 会不会触发"。零副作用（只 echo，不调任何接口、不发消息）。
#
# 2026-09-18 16:29 建库；到 17:32（63 分钟）仍然 0 次触发 → 已超出"注册需要 15 分钟~1 小时"的窗口。
# 现在同时挂两种最常见的 cron 写法做对照实验，看是"没注册"还是"某种写法不被接受"：
#   A) */5 * * * *        —— 通配步长写法（最普遍）
#   B) 7,22,37,52 * * * * —— 列表写法（原方案）
# 两个都跑不出来 → 说明这个账号的公开仓库同样不触发 schedule，直接上外部定时器（见 FALLBACK_cron-job.org.md）。
# 重新推送本文件本身也是一次"触发重新注册"的尝试（社区经验：改动 workflow 后需重新注册）。

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  echo-only:
    runs-on: ubuntu-latest
    steps:
      - name: 只打印，不做任何其他事
        run: |
          echo "schedule 生效 ✅  触发表达式=[${{ github.event.schedule }}]"
          date -u
